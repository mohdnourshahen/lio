server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/headers.conf;

    # v1 URLs -> v2 routes
    location = /lon-visuals-final.html     { return 301 /; }
    location = /index.html                 { return 301 /; }
    location = /zeryab-project.html        { return 301 /work/zeryab-estates; }
    location = /masar-project.html         { return 301 /work/masar; }
    location = /lazure-project.html        { return 301 /work/lazure; }
    location = /skyfalcons-project.html    { return 301 /work/sky-falcons; }
    location = /rambourg-project.html      { return 301 /work/rambourg; }
    location = /wakers17-project.html      { return 301 /work/wakers17; }
    location = /sana-interiors-project.html { return 301 /work/sana-interiors; }

    # one URL per page: drop trailing slashes
    location ~ ^(.+)/$ { return 301 $1; }

    # hashed build assets never change
    location /_nuxt/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(media|clients|og)/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /llms.txt      { include /etc/nginx/snippets/headers.conf; types { } default_type text/markdown; charset utf-8; charset_types text/markdown; add_header Cache-Control "public, max-age=3600" always; }
    location = /llms-full.txt { include /etc/nginx/snippets/headers.conf; types { } default_type text/markdown; charset utf-8; charset_types text/markdown; add_header Cache-Control "public, max-age=3600" always; }

    location = /site.webmanifest { include /etc/nginx/snippets/headers.conf; types { } default_type application/manifest+json; }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        charset utf-8;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
